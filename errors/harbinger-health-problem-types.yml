  live response against this host — none is copied from upstream WordPress documentation or
  inferred.
envelope:
  content_type: application/json
  fields:
    code: {type: string, description: Machine-readable error slug.}
    message: {type: string, description: Human-readable message.}
    data.status: {type: integer, description: HTTP status code repeated in the body.}
    data.params: {type: object, description: Per-parameter message map (rest_invalid_param only).}
    data.details: {type: object, description: Per-parameter nested error object (rest_invalid_param only).}
problems:
  - status: 400
    code: rest_invalid_param
    title: Invalid parameter(s)
    detail: >-
      One or more query or body parameters failed validation. data.params carries a message per
      offending parameter and data.details carries a nested error object with its own code.
    nested_codes: [rest_out_of_bounds]
    remediation: >-
      Correct the named parameter against the schema in the OpenAPI. per_page must be between 1
      and 100 inclusive; page must be 1 or greater.
    observed:
      request: GET https://harbinger-health.com/wp-json/wp/v2/posts?per_page=500
      example: examples/harbinger-health-error-400.json
    source_operation: openapi/harbinger-health-wordpress-wp-v2-openapi.yml#listPosts
  - status: 401
    code: rest_forbidden
    title: Sorry, you are not allowed to do that.
    detail: >-
      The route requires an authenticated user with sufficient capability. Returned by
      /wp/v2/settings, every wp-abilities/v1 route, and the mcp-adapter-default-server MCP endpoint.
    remediation: >-
      Present an application password over HTTP Basic
      (https://harbinger-health.com/wp-admin/authorize-application.php), or for the MCP surface an
      OAuth 2.1 bearer token carrying scope mcp.
    observed:
      request: GET https://harbinger-health.com/wp-json/wp/v2/settings
      example: examples/harbinger-health-error-401.json
    source_operation: openapi/harbinger-health-wordpress-wp-v2-openapi.yml#listSettings
  - status: 401
    code: mcp_unauthorized
    title: MCP authentication required.
    detail: >-
      The MCP OAuth server rejects unauthenticated JSON-RPC. This is the distinct MCP-layer
      challenge, not the generic WordPress rest_forbidden.
    remediation: >-
      Complete the authorization-code + PKCE flow at https://harbinger-health.com/oauth/authorize
      and present the bearer token in the Authorization header. See
      scopes/harbinger-health-scopes.yml.
    observed:
