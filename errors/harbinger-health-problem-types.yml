      body: '{"code":"mcp_unauthorized","message":"MCP authentication required.","data":{"status":401}}'
    source_operation: mcp/harbinger-health-mcp.yml#mcp-oauth-server
  - status: 404
    code: rest_post_invalid_id
    title: Invalid post ID.
    detail: The numeric id in the path does not resolve to a readable object of that type.
    remediation: List the collection first and use an id returned by it.
    observed:
      request: GET https://harbinger-health.com/wp-json/wp/v2/posts/999999999
      example: examples/harbinger-health-error-404.json
    source_operation: openapi/harbinger-health-wordpress-wp-v2-openapi.yml#getPostsById
  - status: 404
    code: rest_no_route
    title: No route was found matching the URL and request method.
    detail: >-
      The path is not a registered route in this namespace, or the method is not allowed on it.
      Note the site returns this for method mismatches too, not a 405.
    remediation: >-
      Fetch https://harbinger-health.com/wp-json/ and confirm the route and its methods before
