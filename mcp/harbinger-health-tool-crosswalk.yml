summary: >-
  Harbinger Health has both a published MCP server and a machine-describable REST surface on the
  same host, which is exactly the condition this crosswalk exists for. It is emitted DELIBERATELY
  EMPTY on the MCP side: the live tools/list is auth-gated (HTTP 401 mcp_unauthorized), the
  WordPress Abilities API that supplies the tools is also 401, and the provider publishes no
  llms.txt, no MCP docs and no tool reference. There is therefore no observed tool name to bind to
  an operationId, and inventing one would fabricate the provider's agent surface. Every REST
  operation is recorded on the rest_only side so the divergence is visible rather than silently
  dropped, and the crosswalk is re-runnable the moment an authenticated introspection is possible.
