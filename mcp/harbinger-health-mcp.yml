tools:
  enumerable: false
  count: null
  note: >-
    NOT ENUMERATED AND NOT INVENTED. The live tool catalogue requires an authenticated
    introspection (tools/list returns 401 to anonymous callers) and Harbinger Health publishes no
    llms.txt, no MCP documentation and no tool reference to fall back to. The tool set is almost
    certainly assembled from the WordPress Abilities API registered at wp-abilities/v1 on the same
    host, whose /abilities and /categories routes are themselves 401 to anonymous callers, but
    that is an inference about the mechanism — not an observed list — so no tool names, no
    descriptions and no input schemas are recorded here.
  to_enumerate:
    - Register a client via the client-ID-metadata-document flow at https://harbinger-health.com/oauth/authorize
    - 'Obtain a bearer token for scope: mcp at https://harbinger-health.com/oauth/token'
    - 'POST {"jsonrpc":"2.0","id":1,"method":"tools/list"} to the mcp-oauth-server endpoint'
    - 'Cross-check against GET /wp-json/wp-abilities/v1/abilities with the same credential'
abilities_api:
  namespace: wp-abilities/v1
  routes:
    - {path: /wp-abilities/v1, methods: [GET], anonymous_status: 401}
    - {path: /wp-abilities/v1/abilities, methods: [GET], anonymous_status: 401}
    - {path: '/wp-abilities/v1/abilities/{name}', methods: [GET], anonymous_status: 401}
    - {path: '/wp-abilities/v1/abilities/{name}/run', methods: [GET, POST, PUT, PATCH, DELETE], anonymous_status: 401}
    - {path: /wp-abilities/v1/categories, methods: [GET], anonymous_status: 401}
    - {path: '/wp-abilities/v1/categories/{slug}', methods: [GET], anonymous_status: 401}
  note: >-
    The Abilities API run route accepts all five write methods, so the MCP surface is not
    read-only by construction. Scope of effect is bounded by the WordPress site, not by any
    clinical or laboratory system.
caveat: >-
  This is a site-content agent surface on a corporate marketing site. It is NOT a clinical,
  diagnostic, genomic or patient-data interface, and nothing about Harbinger HX or RESOLVE is
  reachable through it.
