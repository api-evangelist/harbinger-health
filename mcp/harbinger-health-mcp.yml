summary: >-
  Harbinger Health publishes a real, live Model Context Protocol server on its own host. This is
  not a candidate surface derived from an OpenAPI — the MCP namespace is registered in the site's
  WordPress route-discovery document, the server is named as the protected resource in an RFC 9728
  document, and an RFC 8414 authorization-server document declares an OAuth 2.1 flow with a single
  mcp scope. The tool catalogue itself is auth-gated: an anonymous JSON-RPC tools/list returns
  HTTP 401.
