description: >-
  Harbinger Health is a Cambridge, Massachusetts biotechnology company founded out of Flagship
  Pioneering's Flagship Labs in 2018 that is building blood-based early cancer detection on the
  premise that the earliest phases of oncogenesis are marked by the reactivation of core
  developmental programs. Its proprietary Harbinger HX platform pairs cell-free DNA methylation
  assay chemistry tuned for low tumour fraction with machine learning operating under biologically
  informed constraints, and supports cancer signal detection, tumour content estimation and
  tissue-of-origin inference. RESOLVE, the company's clinical application of that platform, is
  positioned to generate clarity in the uncertain window between suspicion of cancer and diagnosis,
  across cancer types and clinical contexts, and is run out of a CLIA-certified and CAP-accredited
  high-complexity laboratory. The company raised a 100 million dollar round to expand its
  blood-based detection suite and is led by CEO Ajit Singh with Chief Innovation Officer Tony
  Shuber, a co-founder of Exact Sciences. Harbinger Health's API posture is minimal and clinical
  rather than commercial: there is no developer portal, no published documentation, no OpenAPI, no
  SDKs, no pricing and no self-serve API access, and the developer., docs., api., portal., status.
  and trust. subdomains do not resolve. What it does publish is unusual for a company with no
  developer programme - the corporate site serves a live, anonymously readable WordPress REST API
  (268 routes across 15 namespaces), an RFC 8414 OAuth 2.1 authorization-server metadata document,
  an RFC 9728 protected-resource document, and a real Model Context Protocol server namespace
  gated behind an mcp scope, alongside the WordPress Abilities API. That makes Harbinger Health
  machine-discoverable at the agent layer while none of its clinical, laboratory or diagnostic
  capability is exposed programmatically to third parties.
