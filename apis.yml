apis:
  - aid: harbinger-health:harbinger-health-wordpress-rest-api
    name: Harbinger Health WordPress REST API
    description: >-
      The stock WordPress REST API served by Harbinger Health's corporate site at
      https://harbinger-health.com/wp-json/. Confirmed live and anonymously readable on 2026-08-04
      (HTTP 200, application/json, 256,594 bytes), the root discovery document self-describes 268
      routes across 15 namespaces including wp/v2, wp-abilities/v1, mcp, yoast/v1, redirection/v1,
      leadin/v1 (HubSpot) and wp-rocket/v1, and advertises WordPress application passwords as its
      authentication scheme. A custom events post type is registered alongside posts, pages and
      media. This is a content-management surface for the corporate website - it is NOT a clinical,
      laboratory, diagnostic, genomic or patient-data API, no Harbinger HX or RESOLVE result is
      reachable through it, and Harbinger Health does not document or support it as a developer
      product. It is catalogued here because it is the only publicly callable, machine-describable
      API found on any Harbinger Health host.
    humanURL: https://developer.wordpress.org/rest-api/
    baseURL: https://harbinger-health.com/wp-json
    tags:
      - CMS
      - Content
      - WordPress
      - Website
    properties:
      - type: OpenAPI
        url: openapi/harbinger-health-wordpress-wp-v2-openapi.yml
      - type: Overlay
        url: overlays/harbinger-health-wordpress-wp-v2-overlay.yaml
      - type: Examples
        url: examples/_index.yml
      - type: DataModel
