openapi: 3.1.0
info:
  title: Harbinger Health WordPress REST API (wp/v2)
  version: 2.0.0
  summary: The wp/v2 namespace of the WordPress REST API served by Harbinger Health's website.
  description: DERIVED, NOT PUBLISHED BY HARBINGER HEALTH. Harbinger Health publishes no OpenAPI definition and
    does not document or support this surface as a developer product. This document was derived mechanically by
    API Evangelist from the live WordPress route-discovery document fetched from https://harbinger-health.com/wp-json/
    on 2026-08-04 (268 routes across 15 namespaces; the wp/v2 namespace is captured here). Every path, method, parameter
    name, type, enum, default and description is copied verbatim from that discovery document. Response bodies are
    intentionally left as generic objects because the discovery document does not publish response schemas; error
    responses are grounded in payloads probed live against this host. This is a content-management surface for the
    corporate website - it is NOT a clinical, laboratory, diagnostic, genomic or patient-data API, and no Harbinger
    HX or RESOLVE test data is reachable through it.
  contact:
    name: Harbinger Health
    url: https://harbinger-health.com/contact/
    email: info@harbinger-health.com
  x-apievangelist-method: derived
  x-apievangelist-source: openapi/harbinger-health-wp-json-discovery.json
  x-apievangelist-derived: '2026-08-04'
  x-upstream-documentation: https://developer.wordpress.org/rest-api/
