  - name: applicationPassword
    type: http
    scheme: basic
    description: >-
      WordPress application password, advertised by the site's own route-discovery document under
      authentication.application-passwords. Credentials are issued from
      https://harbinger-health.com/wp-admin/authorize-application.php and presented as
      'Authorization: Basic base64(user:application-password)'. Required for edit context, for every
      write method, and for the routes that returned 401 anonymously (/wp/v2/settings,
      wp-abilities/v1/*).
